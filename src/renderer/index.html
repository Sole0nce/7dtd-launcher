<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <meta name="color-scheme" content="dark">
  <title>七日杀启动器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2.5 3.5 9.3v13.4L16 29.5l12.5-6.8V9.3L16 2.5Z" fill="none" stroke="#c1121f" stroke-width="1.8"/>
          <path d="M9.5 11.5h13L15 22l-2.2-4.6-3.3-5.9Z" fill="#e0651a"/>
        </svg>
        <span class="brand-name">七日杀</span>
        <span class="brand-sub">LAUNCHER</span>
        <span class="brand-ver" id="app-version"></span>
      </div>
      <div class="win-controls">
        <button class="win-btn" id="win-min" title="最小化" aria-label="最小化">—</button>
        <button class="win-btn" id="win-max" title="最大化" aria-label="最大化">□</button>
        <button class="win-btn danger" id="win-close" title="关闭" aria-label="关闭">✕</button>
      </div>
    </header>

    <main class="content">
      <section class="panel detect">
        <div class="panel-head">
          <h2>游戏位置</h2>
          <span class="badge" id="detect-badge"><i class="dot"></i><span id="detect-text">检测中</span></span>
        </div>
        <div class="path-box">
          <code id="game-path">正在扫描 Steam 库…</code>
          <button class="icon-btn" id="btn-open-game" title="打开游戏目录" aria-label="打开游戏目录">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.2 1.5H13A1.5 1.5 0 0 1 14.5 6v6A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12V4.5Z" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
          </button>
        </div>
        <div class="meta-grid">
          <div class="meta"><span>探测来源</span><strong id="meta-source">—</strong></div>
          <div class="meta"><span>构建号</span><strong id="meta-build">—</strong></div>
          <div class="meta"><span>占用空间</span><strong id="meta-size">—</strong></div>
          <div class="meta"><span>最近更新</span><strong id="meta-updated">—</strong></div>
          <div class="meta"><span>游戏语言</span><strong id="meta-lang">—</strong></div>
          <div class="meta"><span>上次启动</span><strong id="meta-played">—</strong></div>
        </div>
        <div class="detect-actions">
          <button class="btn ghost" id="btn-redetect">重新检测</button>
          <button class="btn ghost" id="btn-pick">手动选目录…</button>
          <div class="manual">
            <input id="manual-path" type="text" spellcheck="false" placeholder="或粘贴 exe / steamapps / 游戏目录路径">
            <button class="btn ghost" id="btn-manual">应用</button>
          </div>
        </div>
      </section>

      <section class="panel launch">
        <div class="panel-head">
          <h2>启动方式</h2>
          <span class="hint" id="launch-state">等待检测</span>
        </div>
        <div class="modes" id="modes" role="radiogroup" aria-label="启动方式">
          <button class="mode active" data-mode="steam" role="radio" aria-checked="true">
            <strong>Steam 启动</strong>
            <span>官方入口 · 成就 / 联机</span>
          </button>
          <button class="mode" data-mode="eac" role="radio" aria-checked="false">
            <strong>EAC 反作弊</strong>
            <span>直启 7DaysToDie_EAC.exe</span>
          </button>
          <button class="mode" data-mode="direct" role="radio" aria-checked="false">
            <strong>无反作弊</strong>
            <span>直启 7DaysToDie.exe · Mod</span>
          </button>
        </div>
        <label class="field">
          <span>附加启动参数</span>
          <input id="extra-args" type="text" spellcheck="false" placeholder="例如：-logfile out.txt -screen-width 1600">
        </label>
        <button class="launch-btn" id="btn-launch" disabled>启 动 游 戏</button>
      </section>

      <div class="cols">
        <section class="panel mods">
          <div class="panel-head">
            <h2>已安装 Mod</h2>
            <span class="badge soft" id="mod-count">0</span>
          </div>
          <div class="list" id="mod-list"><p class="empty">尚未检测到游戏目录</p></div>
          <div class="panel-foot">
            <button class="btn ghost small" id="btn-open-mods">打开 Mods 目录</button>
            <span class="dim" id="mod-archives"></span>
          </div>
        </section>

        <section class="panel saves">
          <div class="panel-head">
            <h2>存档</h2>
            <span class="badge soft" id="save-count">0</span>
          </div>
          <div class="list" id="save-list"><p class="empty">暂无存档</p></div>
          <div class="panel-foot">
            <button class="btn ghost small" id="btn-open-saves">打开存档目录</button>
            <span class="dim" id="save-size"></span>
          </div>
        </section>
      </div>
    </main>

    <footer class="statusbar">
      <span id="status-text">路径来源：Windows 注册表 → libraryfolders.vdf → 常见磁盘位置</span>
      <span class="dim" id="status-right"></span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="renderer.js"></script>
</body>
</html>
